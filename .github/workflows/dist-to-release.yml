---
name: Build Release

on:
  release:
    types: [created,published] # Indicates that it fires when a new Release is created

env: # Set environment variables
  TZ: Asia/Shanghai # Time zone (setting the time zone allows the `Latest Update Time` to use the time zone time)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v5

      - name: build project ⚗️
        uses: actions/setup-node@v5
        with:
          node-version: 14
          cache: 'npm'
          cache-dependency-path: "package-lock.json"

      - run: |
          sed -i 's@http://localhost:8888/@/@g' .env.production
          git config --global url."https://".insteadOf git://
          npm install
          yarn build:prod

      - run: |
          zip -q -r dist.zip dist
          openssl md5 dist.zip > dist.zip.md5

      - name: Upload release package
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist.zip
            dist.zip.md5
